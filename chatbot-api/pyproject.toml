[project]
name = "uel-department-chatbot-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pwdlib[argon2]>=0.2,<1", "pydantic-settings>=2.6,<3", "pymongo>=4.10,<5"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["data/*.json", "db/*.sql"]
