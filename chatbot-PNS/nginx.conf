server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Tăng max body size cho upload tài liệu (nếu có)
  client_max_body_size 20m;

  # Gzip cho static assets
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # ─────────────────────────────────────────────────────────────
  # SSE streaming cho /api/chat/stream — KHÔNG buffer, giữ connection alive lâu.
  # Nếu thiếu các header dưới, chat sẽ "đứng" cho đến khi response xong toàn bộ.
  # ─────────────────────────────────────────────────────────────
  location = /api/chat/stream {
    proxy_pass http://api:30957/api/chat/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # CỰC QUAN TRỌNG cho SSE:
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    chunked_transfer_encoding on;
    proxy_redirect off;
  }

  # ─────────────────────────────────────────────────────────────
  # Các endpoint /api/* khác — buffer mặc định, timeout dài
  # ─────────────────────────────────────────────────────────────
  location /api/ {
    proxy_pass http://api:30957/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Static assets — cache mạnh (1 năm, immutable hash trong filename)
  location ~* \.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
